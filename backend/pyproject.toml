[project]
name = "research-union-backend"
version = "0.1.0"
description = "研究生会 AI 协同工作台后端"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "sqlalchemy>=2.0.40,<3.0.0",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "alembic>=1.16.0,<2.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "httpx>=0.28.0,<1.0.0",
    "rq>=2.6.0,<3.0.0",
    "redis>=6.4.0,<7.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "pymupdf>=1.26.0,<2.0.0",
    "jieba>=0.42.1,<1.0.0",
    "pgvector>=0.4.1,<1.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "orjson>=3.11.0,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=6.2.0,<7.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
